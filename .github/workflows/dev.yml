name: Dev CI

# Development pipeline: verify the code and the images actually build, then
# publish a `dev` tag to GHCR. This workflow never deploys — deployment to
# Coolify happens only from main (.github/workflows/main.yml).

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  frontend-checks:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Build
        working-directory: frontend
        # Placeholder values — this job only proves the bundle compiles.
        # The real URLs are baked in by the deploy workflow.
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
          NEXT_PUBLIC_BACKEND_URL: http://localhost:8000
          NEXT_PUBLIC_LANGGRAPH_API_URL: http://localhost:8000
        run: npm run build

  backend-checks:
    name: Backend syntax and imports
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Byte-compile sources
        working-directory: backend
        run: python -m compileall -q src

      - name: Import the FastAPI app
        working-directory: backend
        # Catches broken imports and router registration before the image builds.
        env:
          DATABASE_URL: sqlite+aiosqlite:///./ci.db
          ENVIRONMENT: ci
        run: python -c "from src.api.main import app; print(f'{len(app.routes)} routes registered')"

  images:
    name: Build and push dev images
    runs-on: ubuntu-latest
    needs: [frontend-checks, backend-checks]
    # Forks cannot write to the registry; PR runs only need the checks above.
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: ./backend
            file: ./backend/Dockerfile
          - name: frontend
            context: ./frontend
            file: ./frontend/Dockerfile

    steps:
      - uses: actions/checkout@v4

      # ghcr.io namespaces must be lowercase; owner names may not be.
      - name: Resolve image name
        id: img
        run: echo "name=${REGISTRY}/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/evalyn-${{ matrix.name }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          # The backend is FROM langchain/langgraph-api, which is amd64-only.
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ${{ steps.img.outputs.name }}:dev
            ${{ steps.img.outputs.name }}:dev-${{ github.sha }}
          cache-from: type=gha,scope=dev-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=dev-${{ matrix.name }}
          # NEXT_PUBLIC_* are compiled into the bundle at build time and cannot
          # be changed by Coolify at runtime. These are the staging URLs —
          # set them as repository variables under the `dev` environment.
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ vars.DEV_NEXT_PUBLIC_API_BASE_URL }}
            NEXT_PUBLIC_BACKEND_URL=${{ vars.DEV_NEXT_PUBLIC_BACKEND_URL }}
            NEXT_PUBLIC_LANGGRAPH_API_URL=${{ vars.DEV_NEXT_PUBLIC_LANGGRAPH_API_URL }}
            NEXT_PUBLIC_APP_URL=${{ vars.DEV_NEXT_PUBLIC_APP_URL }}
            NEXT_PUBLIC_FACEBOOK_APP_ID=${{ vars.NEXT_PUBLIC_FACEBOOK_APP_ID }}
            NEXT_PUBLIC_FACEBOOK_CONFIG_ID=${{ vars.NEXT_PUBLIC_FACEBOOK_CONFIG_ID }}

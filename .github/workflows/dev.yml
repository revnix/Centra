name: Deploy — Dev

# All real logic lives in _deploy.yml — this file only decides when to fire
# and which environment/tag to deploy.

on:
  push:
    branches: [dev]
  workflow_dispatch: {}

jobs:
  deploy:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_deploy.yml
    with:
      environment: dev
      image_tag: dev
    secrets: inherit

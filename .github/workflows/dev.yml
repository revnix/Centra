name: Dev CI

# Lightweight sanity check for the dev branch. No images, no deployment —
# everything real happens in main.yml.

on:
  push:
    branches:
      - dev
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint and compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Backend syntax check
        working-directory: backend
        # Byte-compile only — no dependency install, so this stays fast and
        # needs no API keys.
        run: python -m compileall -q src

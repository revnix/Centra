name: Deploy — Production

# All real logic lives in _deploy.yml — this file only decides when to fire
# and which environment/tag to deploy. The `production` GitHub Environment
# should have a required-reviewer protection rule, which pauses the deploy
# job inside _deploy.yml for manual approval before it touches Coolify.

on:
  # Fires when a PR is merged into main OR on a direct push to main
  push:
    branches: [main]
  # Also fires when a pull_request targeting main is closed AND merged
  pull_request:
    branches: [main]
    types: [closed]
  workflow_dispatch: {}

jobs:
  deploy:
    # Skip if this was a PR close without merge
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_deploy.yml
    with:
      environment: production
      image_tag: latest
    secrets: inherit

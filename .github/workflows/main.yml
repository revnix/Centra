name: Production Deploy

# Production pipeline: verify, build multi-tagged images, push to GHCR, then
# tell Coolify (135.181.105.165) to pull and redeploy.

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      skip_deploy:
        description: "Build and push images but do not redeploy Coolify"
        type: boolean
        default: false

concurrency:
  # Never let two production deploys race; queue instead of cancelling so a
  # half-finished rollout is not left in place.
  group: production-deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  verify:
    name: Verify before release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend type check
        working-directory: frontend
        run: |
          npm ci
          npx tsc --noEmit

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Backend import check
        working-directory: backend
        env:
          DATABASE_URL: sqlite+aiosqlite:///./ci.db
          ENVIRONMENT: ci
        run: |
          pip install -r requirements.txt
          python -m compileall -q src
          python -c "from src.api.main import app; print(f'{len(app.routes)} routes registered')"

  build:
    name: Build and push ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: ./backend
            file: ./backend/Dockerfile
          - name: frontend
            context: ./frontend
            file: ./frontend/Dockerfile

    steps:
      - uses: actions/checkout@v4

      # ghcr.io namespaces must be lowercase; owner names may not be.
      - name: Resolve image name
        id: img
        run: echo "name=${REGISTRY}/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/evalyn-${{ matrix.name }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.img.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          # The backend is FROM langchain/langgraph-api, which is amd64-only —
          # and the Hetzner host is amd64, so a single platform is correct.
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=prod-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=prod-${{ matrix.name }}
          # NEXT_PUBLIC_* are compiled into the frontend bundle here and CANNOT
          # be changed by Coolify at runtime — these must be the real public
          # production URLs. Set them as repository variables.
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ vars.NEXT_PUBLIC_API_BASE_URL }}
            NEXT_PUBLIC_BACKEND_URL=${{ vars.NEXT_PUBLIC_BACKEND_URL }}
            NEXT_PUBLIC_LANGGRAPH_API_URL=${{ vars.NEXT_PUBLIC_LANGGRAPH_API_URL }}
            NEXT_PUBLIC_APP_URL=${{ vars.NEXT_PUBLIC_APP_URL }}
            NEXT_PUBLIC_FACEBOOK_APP_ID=${{ vars.NEXT_PUBLIC_FACEBOOK_APP_ID }}
            NEXT_PUBLIC_FACEBOOK_CONFIG_ID=${{ vars.NEXT_PUBLIC_FACEBOOK_CONFIG_ID }}

  deploy:
    name: Deploy to Coolify
    runs-on: ubuntu-latest
    needs: build
    if: inputs.skip_deploy != true
    environment:
      name: production
      url: ${{ vars.NEXT_PUBLIC_APP_URL }}
    steps:
      - name: Trigger Coolify deployment
        env:
          WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK_URL }}
          TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "::error::COOLIFY_WEBHOOK_URL is not set. Images were pushed to GHCR but nothing was deployed."
            exit 1
          fi
          curl --fail-with-body --silent --show-error \
               --header "Authorization: Bearer $TOKEN" "$WEBHOOK"
          echo "Coolify deployment triggered."

      - name: Summary
        run: |
          {
            echo "### Deployed"
            echo ""
            echo "- commit: \`${{ github.sha }}\`"
            echo "- images: \`evalyn-backend\`, \`evalyn-frontend\` (\`latest\`, \`sha-${{ github.sha }}\`)"
          } >> "$GITHUB_STEP_SUMMARY"
